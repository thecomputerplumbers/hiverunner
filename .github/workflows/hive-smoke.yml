name: Hive integrated smoke
on:
  push:
    branches: [feat-scale-set-listener]
    paths: [.github/workflows/hive-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: hive
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify the isolated guest
        run: |
          test "$(uname -m)" = aarch64
          test "$(nproc)" = 2
          test "$(id -un)" = runner
      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
      - name: Run the daemon tests on Linux
        working-directory: daemon
        run: go test ./...
