  "@tailwindcss/postcss": ^4
  "@types/node": ^26.6.2
  "@types/react": ^19
  "@types/react-dom": ^19
  "@turbo/gen": ^2.11.5
  "@vitejs/plugin-react": 6.1.1
  "@vitejs/plugin-rsc": 0.5.35
  class-variance-authority: ^0.7.1
  cn: ^0.3.0
  lucide-react: 1.47.0
  next-themes: ^0.4.6
